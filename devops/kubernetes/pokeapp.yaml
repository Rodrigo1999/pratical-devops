apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokeapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokeapp
  template:
    metadata:
      labels:
        app: pokeapp
    spec:
      initContainers:
        - name: run-migration
          image: ghcr.io/rodrigo1999/pokeapp-migrations
          command: ["npm", "run", "dev:knex:migrate"]
          envFrom:
          - secretRef:
              name: pokeapp-env
      containers:
        - name: pokeapp
          image: ghcr.io/rodrigo1999/pokeapp
          ports:
          - containerPort: 5000
            protocol: TCP
          envFrom:
          - secretRef:
              name: pokeapp-env
          startupProbe:
            tcpSocket:
              port: 5000
            failureThreshold: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              port: 5000
              path: /healthz
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "200m"
              memory: "320Mi"
            limits:
              cpu: "1000m"
              memory: "1280Mi"
---

apiVersion: v1
kind: Service
metadata:
  name: pokeapp
spec:
  type: NodePort
  selector:
    app: pokeapp
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    nodePort: 30000 # Port to loadbalancer

--- 

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-pokeapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokeapp
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - periodSeconds: 10
          type: Percent
          value: 100
        - periodSeconds: 10
          type: Pods
          value: 4
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - periodSeconds: 15
          type: Percent
          value: 100
        - periodSeconds: 15
          type: Pods
          value: 4
      selectPolicy: Min